<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oLdpZ — Progetti</title>
  <!-- Script di pulizia: rimuove eventuale service worker vecchio
       registrato al root scope, per evitare conflitti con i progetti
       in sottocartelle (es. /atdw/ e /gestione-affitti/). -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => {
          // Pulisce solo i SW registrati al root scope di questo dominio
          if (r.scope === window.location.origin + '/') {
            r.unregister();
          }
        });
      });
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0f14;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 { color: #00ffb4; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-top: 0; margin-bottom: 2rem; }
    .projects {
      display: grid;
      gap: 1rem;
      width: 100%;
      max-width: 500px;
    }
    a.project {
      display: block;
      padding: 1rem 1.25rem;
      background: #1a2332;
      border: 1px solid #2d3b4f;
      border-radius: 0.5rem;
      color: #e2e8f0;
      text-decoration: none;
      transition: all 0.15s;
    }
    a.project:hover {
      background: #233145;
      border-color: #00ffb4;
      transform: translateY(-1px);
    }
    a.project strong { display: block; margin-bottom: 0.25rem; }
    a.project span { color: #94a3b8; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>oLdpZ</h1>
  <p>Progetti web</p>
  <div class="projects">
    <a href="/atdw/" class="project">
      <strong>ATDW Solo Tool</strong>
      <span>Across a Thousand Dead Worlds — Solo Play Tool</span>
    </a>
    <a href="/gestione-affitti/" class="project">
      <strong>Gestione Affitti</strong>
      <span>Gestione affitti immobili e utenze</span>
    </a>
  </div>
</body>
</html>
